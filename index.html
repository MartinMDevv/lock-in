<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El ícono de la app es siempre el oscuro, con el núcleo lima, sin
         importar el tema que elija cada persona: es la marca, como la ven el
         navegador, el teléfono y las tiendas. Dentro de la app, el logo sí
         sigue el tema (components/ui/LogoMark.tsx). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover: necesario para que la app use la pantalla completa
         bajo el notch y sobre la barra de gestos cuando corre instalada.
         interactive-widget=resizes-content: en Android el teclado achica la
         página en vez de taparla, así las hojas inferiores quedan encima de él. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- El fondo oscuro de los tokens (--color-bg): el tema por defecto. -->
    <meta name="theme-color" content="#0a0c0f" />
    <meta
      name="description"
      content="Un solo lugar para horario, tareas, gimnasio y finanzas personales."
    />
    <title>Lock In</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
