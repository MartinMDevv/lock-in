name: CI

# Solo dispara con pushes a este repositorio, nunca con pull_request.
# El runner es propio (corre en la máquina del autor) y el repo es público:
# un `pull_request` desde un fork ajeno ejecutaría código de un desconocido
# acá adentro. Trabajando solo no se pierde nada — las ramas `feat/…` se
# verifican igual antes de mergear. Ver docs/DECISIONES.md D15.
on:
  push:
    branches: ['**']

# Sin permisos de escritura: el CI solo lee y verifica.
permissions:
  contents: read

jobs:
  verificar:
    name: Verificar
    # Runner propio: la cuenta está bloqueada por facturación y los runners
    # de GitHub no arrancan. Ver docs/DECISIONES.md D15.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      # El escáner corre PRIMERO. Si se filtró un secreto, no tiene sentido
      # gastar minutos compilando: hay que sacarlo antes de que se mergee.
      - name: Escanear secretos y datos personales
        run: ./scripts/check-secrets.sh --all

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
