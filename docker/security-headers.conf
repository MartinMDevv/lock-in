# Cabeceras de seguridad de Lock In. Se incluyen en cada `location` porque
# nginx no hereda los `add_header` del server si el location define los suyos.
# `always`: también en las respuestas de error.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# La sesión vive en localStorage: la CSP limita de dónde puede venir código
# (contra XSS) y frame-ancestors impide meter la app en un iframe ajeno
# (clickjacking). Solo se habla con el propio sitio y con Supabase.
# style-src lleva 'unsafe-inline' porque React escribe atributos style.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
