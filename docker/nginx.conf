# nginx para Lock In: una SPA con sus rutas en el cliente.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # No anunciar la versión de nginx en los errores ni en las cabeceras.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los archivos de /assets llevan un hash en el nombre: si cambian, cambia
    # el nombre. Se pueden guardar un año sin miedo.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # index.html nunca se guarda en caché: es el que apunta a los assets nuevos.
        add_header Cache-Control "no-cache";
        # Las rutas (/gym, /money…) las resuelve React: todo cae en index.html,
        # igual que la reescritura de vercel.json.
        try_files $uri $uri/ /index.html;
    }
}
